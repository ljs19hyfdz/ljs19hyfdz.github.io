<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;}html,body{width:100%;height:100%;overflow:hidden;}
#map{width:100%;height:100vh;}
</style>
</head>
<body>
<div id="map"></div>
<script>
const map = L.map('map').setView([35,105],3);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{<br/>attribution:'&copy; OpenStreetMap'
}).addTo(map);

<p>&#x2F;&#x2F;示例点位，后续可以自行增删</p>
<p>L.marker([39.9042,116.4074]).addTo(map).bindPopup(“北京”);<br>L.marker([31.2304,121.4737]).addTo(map).bindPopup(“上海”);<br></script></p>
</body>
</html>
